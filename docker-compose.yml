x-app-defaults: &app-defaults          # security + recovery settings shared by the three app services
  restart: unless-stopped              # restart after a crash or a Docker restart
  read_only: true                      # immutable root filesystem (Activity 3)
  tmpfs:
    - /tmp                             # the only writable spot
  cap_drop: [ALL]                      # optional extra: drop all Linux capabilities
  security_opt:
    - no-new-privileges:true           # optional extra: block privilege escalation

x-logging: &logging                    # rotate logs so they cannot fill the disk
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}                # NEW: a limited user (must NOT be "root")
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    # no "ports:" -> MySQL is only reachable from other containers
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql:/docker-entrypoint-initdb.d:ro
    networks:
      - backend
    healthcheck:
      # 127.0.0.1 (TCP) instead of localhost (socket): the temporary init-time server only listens on
      # the socket, so this only passes once the real server is up. The password is read from the
      # container's own environment, so it no longer appears in the compose file or `docker inspect`.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *logging
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M                         # InnoDB buffer pool (128M default) + connections + headroom

  mongodb:
    image: mongo:6.0
    restart: unless-stopped
    # no "ports:" -> MongoDB is only reachable from other containers
    volumes:
      - mongo_data:/data/db
    networks:
      - backend
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *logging
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M                         # WiredTiger cache + connections

  auth-service:
    <<: *app-defaults
    build: ./auth-service
    # no "ports:" -> only the web app talks to it
    environment:
      - DB_HOST=mysql
      - DB_USER=${MYSQL_USER}
      - DB_PASSWORD=${MYSQL_PASSWORD}
      - DB_NAME=${MYSQL_DATABASE}
      - AUTH_TOKEN_SECRET=${AUTH_TOKEN_SECRET}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      # The service has no GET route yet, so check that the port accepts connections.
      test: ["CMD", "node", "-e", "require('net').connect(3000,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging: *logging
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M                         # bcrypt is CPU-bound; memory use is small

  analytics-service:
    <<: *app-defaults
    build: ./analytics-service
    # no "ports:" -> only the web app calls /trigger-analytics
    environment:
      - DB_HOST=mysql
      - DB_USER=${MYSQL_USER}
      - DB_PASSWORD=${MYSQL_PASSWORD}
      - DB_NAME=${MYSQL_DATABASE}
      - MONGO_URI=mongodb://mongodb:27017/
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 6000), 3).close()"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging: *logging
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M                         # one aggregate query per trigger

  web-app:
    <<: *app-defaults
    build: ./web-app
    ports:
      - "127.0.0.1:5000:5000"                  # the ONLY published port, local machine only
    environment:
      - DB_HOST=mysql
      - DB_USER=${MYSQL_USER}
      - DB_PASSWORD=${MYSQL_PASSWORD}
      - DB_NAME=${MYSQL_DATABASE}
      - MONGO_URI=mongodb://mongodb:27017/
      - AUTH_SERVICE_URL=http://auth-service:3000
      - ANALYTICS_SERVICE_URL=http://analytics-service:6000
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY}
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      analytics-service:
        condition: service_healthy
    networks:
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/login', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging: *logging
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M                         # Flask + short-lived DB connections

volumes:
  mysql_data:
  mongo_data:

networks:
  frontend: {}                                 # reachable from the host (web-app only)
  backend:
    internal: true                             # no route to or from the outside world